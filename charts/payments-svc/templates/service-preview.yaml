apiVersion: v1
kind: Service
metadata:
  name: {{ include "payments-svc.fullname" . }}-preview
  labels:
    {{- include "payments-svc.labels" . | nindent 4 }}
    driftguard.io/service-role: preview
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "payments-svc.selectorLabels" . | nindent 4 }}
