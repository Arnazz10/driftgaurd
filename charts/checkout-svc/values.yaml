replicaCount: 4

image:
  repository: REPLACE_WITH_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/checkout-svc
  tag: v1
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 8080

env:
  version: v1
  failRate: "0"

analysis:
  prometheusAddress: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
  errorRateThreshold: 0.05
  p95LatencyThresholdSeconds: 0.5

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

serviceMonitor:
  enabled: true
  interval: 15s

