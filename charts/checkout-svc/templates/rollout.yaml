apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "checkout-svc.fullname" . }}
  labels:
    {{- include "checkout-svc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "checkout-svc.selectorLabels" . | nindent 6 }}
  strategy:
    canary:
      # Replica-weighted canary keeps the demo cheap without requiring a mesh or ingress controller.
      steps:
        - setWeight: 20
        - pause:
            duration: 60s
        - analysis:
            templates:
              - templateName: {{ include "checkout-svc.fullname" . }}-analysis
        - setWeight: 40
        - pause:
            duration: 60s
        - analysis:
            templates:
              - templateName: {{ include "checkout-svc.fullname" . }}-analysis
        - setWeight: 60
        - pause:
            duration: 60s
        - analysis:
            templates:
              - templateName: {{ include "checkout-svc.fullname" . }}-analysis
        - setWeight: 100
  template:
    metadata:
      labels:
        {{- include "checkout-svc.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: checkout-svc
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: SERVICE_NAME
              value: checkout-svc
            - name: VERSION
              value: {{ .Values.env.version | quote }}
            - name: FAIL_RATE
              value: {{ .Values.env.failRate | quote }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

