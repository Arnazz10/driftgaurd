<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0c12" />
    <meta name="description" content="DriftGuard — GitOps continuous delivery on AWS EKS with metric-gated canary, blue-green, automatic rollback and ArgoCD self-heal." />
    <title>DriftGuard — Ship fearlessly. Drift never.</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235b8cff'/%3E%3Cstop offset='1' stop-color='%235b8cff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M20 3l13 5v10c0 8.5-5.4 15-13 19C12.4 33 7 26.5 7 18V8z' fill='url(%23g)'/%3E%3Cpath d='M14 20l4.5 4.5L27 15' stroke='%230a0c12' stroke-width='3.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <!-- Boot / loading screen -->
    <div id="boot" aria-live="polite">
      <div class="boot-grid"></div>
      <div class="boot-core">
        <div class="boot-orbit">
          <span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span>
          <span class="sat s1"></span><span class="sat s2"></span><span class="sat s3"></span>
          <svg class="boot-shield" viewBox="0 0 40 40" aria-hidden="true">
            <defs>
              <linearGradient id="bootg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#5b8cff" /><stop offset="1" stop-color="#5b8cff" />
              </linearGradient>
            </defs>
            <path class="bs-outline" d="M20 3l13 5v10c0 8.5-5.4 15-13 19C12.4 33 7 26.5 7 18V8z" />
            <path class="bs-fill" d="M20 3l13 5v10c0 8.5-5.4 15-13 19C12.4 33 7 26.5 7 18V8z" />
            <path class="bs-check" d="M14 20l4.5 4.5L27 15" />
          </svg>
        </div>
        <div class="boot-brand"><span>Drift</span><b>Guard</b></div>
        <div class="boot-log" id="bootLog"></div>
        <div class="boot-bar"><i id="bootBar"></i></div>
        <div class="boot-meta"><span id="bootPct">000</span><span>% · reconciling desired state</span></div>
      </div>
      <button class="boot-skip" id="bootSkip" type="button">skip ↵</button>
      <div class="boot-curtain top"></div>
      <div class="boot-curtain bottom"></div>
    </div>

    <canvas id="bgCanvas" aria-hidden="true"></canvas>
    <div class="bg-aurora" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="bg-grain" aria-hidden="true"></div>
    <div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>
    <div class="scroll-progress" id="scrollProgress" aria-hidden="true"></div>

    <header class="nav" id="nav">
      <a class="nav-brand" href="#/" data-link>
        <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3l13 5v10c0 8.5-5.4 15-13 19C12.4 33 7 26.5 7 18V8z" /><path class="tick" d="M14 20l4.5 4.5L27 15" /></svg>
        <span>Drift<b>Guard</b></span>
      </a>
      <nav class="nav-links" id="navLinks">
        <span class="nav-pill" id="navPill"></span>
        <a href="#/" data-link data-route="/">Home</a>
        <a href="#/dashboard" data-link data-route="/dashboard">Command</a>
        <a href="#/rollouts" data-link data-route="/rollouts">Rollouts</a>
        <a href="#/pipeline" data-link data-route="/pipeline">Pipeline</a>
        <a href="#/services" data-link data-route="/services">Services</a>
        <a href="#/playbooks" data-link data-route="/playbooks">Playbooks</a>
      </nav>
      <div class="nav-right">
        <span class="mode-chip" id="modeChip"><i></i><span>connecting</span></span>
        <a class="nav-gh" href="https://github.com/Arnazz10/driftgaurd" target="_blank" rel="noopener">GitHub</a>
        <button class="nav-burger" id="navBurger" type="button" aria-label="Open menu"><span></span><span></span></button>
      </div>
    </header>

    <main id="app" tabindex="-1"></main>

    <div class="toast-stack" id="toasts" aria-live="polite"></div>

    <script src="/app.js"></script>
  </body>
</html>
