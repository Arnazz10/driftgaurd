server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/checkout/ {
    proxy_pass http://checkout-svc:8080/;
  }

  location /api/payments/ {
    proxy_pass http://payments-svc:8080/;
  }
}
